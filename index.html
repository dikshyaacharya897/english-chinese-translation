<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English to Mandarin Chinese</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<table>
    <tr class="first">
        <th style="width: 400px;" colspan="2"><img src="Translate-English-to-Mandarin.webp"></th>
    </tr>
    <tr>
        <th style="width: 400px;" class="eng">English</th>
        <th style="width: 400px;" class="chinese">Chinese</th>
    </tr>
    <tr>
        <th class="eng">Hello</th>
        <th class="chinese">你好</th>
    </tr>
    <tr>
        <th class="eng">Thankyou</th>
        <th class="chinese">谢谢</th>
    </tr>
    <tr>
        <th class="eng">Tea or Coffee</th>
        <th class="chinese">茶还是咖啡</th>
    </tr>
    <tr>
        <th class="eng">Bye</th>
        <th class="chinese">再见</th>
    </tr>
    <tr>
        <th class="eng">How was your day?</th>
        <th class="chinese">你今天过得怎么样？</th>
    </tr>
    <tr>
        <th class="eng">Have a good day</th>
        <th class="chinese">祝你今天过得愉快</th>
    </tr>

</table>

</body>
</html>
